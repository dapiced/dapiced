<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dominic D'Apice - Azure Infrastructure AI">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#16223f"/>
      <stop offset="55%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="cometTrail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e6f1ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e6f1ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="goldStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e3b341" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="55%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d2b5c"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="nebulaBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glowTitle" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- deep space background -->
  <rect x="0" y="0" width="900" height="300" rx="16" fill="url(#bg)"/>

  <!-- nebulae -->
  <ellipse cx="160" cy="70" rx="130" ry="55" fill="#7c3aed" opacity="0.14" filter="url(#nebulaBlur)"/>
  <ellipse cx="760" cy="60" rx="120" ry="50" fill="#0ea5e9" opacity="0.12" filter="url(#nebulaBlur)"/>
  <ellipse cx="480" cy="260" rx="180" ry="60" fill="#1d4ed8" opacity="0.10" filter="url(#nebulaBlur)"/>

  <!-- static starfield -->
  <g fill="#dbe9ff">
    <circle cx="40" cy="40" r="1.1"/><circle cx="90" cy="120" r="0.9"/><circle cx="130" cy="30" r="1.3"/>
    <circle cx="200" cy="70" r="0.8"/><circle cx="255" cy="35" r="1.1"/><circle cx="310" cy="90" r="0.9"/>
    <circle cx="360" cy="45" r="1.2"/><circle cx="420" cy="25" r="0.8"/><circle cx="470" cy="60" r="1.0"/>
    <circle cx="530" cy="35" r="1.2"/><circle cx="585" cy="75" r="0.9"/><circle cx="640" cy="30" r="1.1"/>
    <circle cx="700" cy="65" r="0.8"/><circle cx="750" cy="25" r="1.2"/><circle cx="810" cy="80" r="0.9"/>
    <circle cx="860" cy="45" r="1.1"/><circle cx="875" cy="140" r="0.9"/><circle cx="25" cy="200" r="1.0"/>
    <circle cx="60" cy="265" r="0.9"/><circle cx="150" cy="245" r="0.8"/><circle cx="330" cy="270" r="1.0"/>
    <circle cx="395" cy="200" r="0.8"/><circle cx="560" cy="205" r="0.9"/><circle cx="610" cy="265" r="1.0"/>
    <circle cx="680" cy="140" r="0.9"/><circle cx="845" cy="270" r="0.9"/><circle cx="290" cy="150" r="0.8"/>
  </g>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="80" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="235" cy="110" r="1.4"><animate attributeName="opacity" values="1;0.15;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="345" cy="65" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="45" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="95" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="40" r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="180" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="255" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="200" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="130" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- bright star with cross glow -->
  <g>
    <circle cx="615" cy="55" r="2" fill="#ffffff" filter="url(#soft)"/>
    <path d="M 615 45 L 615 65 M 605 55 L 625 55" stroke="#cfe4ff" stroke-width="0.8" opacity="0.8"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- ✦ Vincenzo D'Apice (1937-2022) - the golden star, always close by -->
  <g>
    <circle cx="352" cy="48" r="10" fill="url(#goldStar)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="352" cy="48" r="1.9" fill="#ffe9a8"/>
  </g>

  <!-- comet -->
  <g opacity="0">
    <rect x="-90" y="-1.2" width="90" height="2.4" rx="1.2" fill="url(#cometTrail)"/>
    <circle cx="0" cy="0" r="2.6" fill="#ffffff" filter="url(#soft)"/>
    <animateMotion path="M -140,35 L 1040,165" dur="8s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.2;0.3;1" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- constellation shaped like a cloud (the Azure kind) -->
  <g opacity="0.9">
    <text x="64" y="192" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#58a6ff" opacity="0.75" letter-spacing="1">constellation: cloud-01</text>
    <g transform="translate(-38,44)">
      <polyline points="100,215 118,193 142,183 168,188 184,170 210,164 236,171 252,185 272,188 282,202 272,215 100,215"
                fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.45"
                stroke-dasharray="6 5">
        <animate attributeName="stroke-dashoffset" from="110" to="0" dur="9s" repeatCount="indefinite"/>
      </polyline>
      <g fill="#79c0ff">
        <circle cx="100" cy="215" r="2.4"/><circle cx="118" cy="193" r="2"/><circle cx="142" cy="183" r="2.6"/>
        <circle cx="168" cy="188" r="2"/><circle cx="184" cy="170" r="2.4"/><circle cx="210" cy="164" r="2.8"/>
        <circle cx="236" cy="171" r="2"/><circle cx="252" cy="185" r="2.4"/><circle cx="272" cy="188" r="2"/>
        <circle cx="282" cy="202" r="2.4"/><circle cx="272" cy="215" r="2"/>
      </g>
    </g>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- ringed planet with orbiting satellite -->
  <g>
    <ellipse cx="785" cy="228" rx="72" ry="17" fill="none" stroke="url(#ringGrad)" stroke-width="2.6" transform="rotate(-16 785 228)"/>
    <circle cx="785" cy="228" r="36" fill="url(#planetGrad)"/>
    <path d="M 752 220 q 33 -14 66 -2" stroke="#a5d6ff" stroke-width="1.4" fill="none" opacity="0.35"/>
    <path d="M 754 238 q 31 10 62 1" stroke="#0b2447" stroke-width="2.2" fill="none" opacity="0.5"/>
    <g>
      <circle r="3" fill="#e6edf3"/>
      <circle r="6.5" fill="none" stroke="#e6edf3" stroke-width="0.7" opacity="0.5"/>
      <animateMotion path="M 785,172 A 62,26 0 1,1 784.9,172 Z" dur="12s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <g opacity="0">
    <text x="450" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="47" font-weight="700" letter-spacing="7" fill="url(#titleGrad)" filter="url(#glowTitle)">DOMINIC D'APICE</text>
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="0.2s" fill="freeze"/>
  </g>

  <!-- subtitle -->
  <g opacity="0">
    <line x1="118" y1="152" x2="175" y2="152" stroke="#3d4f6d" stroke-width="1"/>
    <text x="450" y="157" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="600" letter-spacing="4" fill="#9baec8">AZURE INFRASTRUCTURE AI &#183; MLOPS &#183; DATAOPS</text>
    <line x1="725" y1="152" x2="782" y2="152" stroke="#3d4f6d" stroke-width="1"/>
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="0.9s" fill="freeze"/>
  </g>

  <!-- terminal line -->
  <g opacity="0">
    <text x="450" y="196" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14">
      <tspan fill="#3fb950">dominic@azure</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">ansible-playbook </tspan><tspan fill="#79c0ff">deploy_the_future.yml</tspan><tspan fill="#58a6ff">&#9612;<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan>
    </text>
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1.6s" fill="freeze"/>
  </g>

  <!-- location tag -->
  <text x="450" y="272" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6e7f9b" letter-spacing="2" opacity="0.9">45.5019&#176; N, 73.5674&#176; W &#8212; MONTR&#201;AL &#183; CANADA &#183; EARTH &#183; ORION ARM</text>
</svg>
